[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-monitor-agent"
version = "0.1.0"
description = "Dependency vulnerability monitoring with deterministic matching and optional LLM triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "feedparser>=6.0,<7",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-cloud-pubsub>=2.27,<3",
  "httpx>=0.27,<1",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21"]

[project.scripts]
security-agent = "security_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["security_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

